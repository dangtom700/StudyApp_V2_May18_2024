<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Vault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar for Recommendations -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Knowledge Vault</h2>
            </div>
            <div class="top-recommendations">
                <h3>Top Recommendations</h3>
                <div id="recommendation-list" class="list-container">
                    <div class="loading">Loading...</div>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Top Search Bar -->
            <header class="top-bar">
                <div class="search-container">
                    <input type="text" id="search-input" placeholder="Search for files..." autocomplete="off">
                    <button id="search-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </button>
                </div>
                <div id="search-results" class="search-results-dropdown hidden"></div>
            </header>

            <!-- PDF Viewer -->
            <section class="pdf-viewer-section">
                <div class="viewer-header">
                    <h2 id="current-doc-title">Select a document to read</h2>
                </div>
                <div class="viewer-container">
                    <iframe id="pdf-frame" src="" class="hidden"></iframe>
                    <div id="empty-state" class="empty-state">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                        <p>Search or click a recommendation to start reading reading</p>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
